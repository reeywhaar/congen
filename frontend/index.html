<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <meta name="keywords" content="webgl, canvas, texture generator, canvas generator, paper texture, concrete texture">
  <meta name="author" content="Misha Vyrtsev">
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="stylesheet" href="style.css">
  <script type="module" src="/src/main.ts"></script>
  <title>Vyrtsev Texture Generator</title>
</head>

<body>
  <canvas width="0" height="0"></canvas>
  <div class="controls">
    <section class="controls__section">
      <div class="controls__label">Image</div>
      <select class="src" hidden></select>
      <button type="button" class="src-button" aria-haspopup="dialog">
        <img class="src-button__thumb" alt="">
        <span class="src-button__name"></span>
      </button>
    </section>

    <section class="controls__section">
      <div class="controls__label">Filters</div>
      <div class="filter-stack"></div>
      <div class="applied-filters"></div>
    </section>

    <section class="controls__section adjustments">
      <div class="adjustment">
        <div class="adjustment__header">
          <label class="controls__label" for="brightness">Brightness</label>
          <output class="adjustment__value" for="brightness"></output>
        </div>
        <input id="brightness" type="range" class="adjustment__input brightnessInput" step="0.01" value="0" min="-1"
          max="1">
      </div>
      <div class="adjustment">
        <div class="adjustment__header">
          <label class="controls__label" for="contrast">Contrast</label>
          <output class="adjustment__value" for="contrast"></output>
        </div>
        <input id="contrast" type="range" class="adjustment__input contrastInput" step="0.01" value="0" min="-1"
          max="1">
      </div>
      <div class="adjustment">
        <div class="adjustment__header">
          <label class="controls__label" for="saturation">Saturation</label>
          <output class="adjustment__value" for="saturation"></output>
        </div>
        <input id="saturation" type="range" class="adjustment__input saturationInput" step="0.01" value="0" min="-1"
          max="1">
      </div>
    </section>

    <section class="controls__section controls__section_columns">
      <div class="field">
        <label class="controls__label" for="scale">Scale</label>
        <div class="stepper">
          <button type="button" class="stepper__button" data-direction="-1" aria-label="Decrease scale">&minus;</button>
          <input id="scale" type="text" inputmode="decimal" autocomplete="off" spellcheck="false"
            class="stepper__input zinput" value="0.50" data-min="0.1" data-max="10" data-step-factor="1.25"
            data-decimals="2">
          <button type="button" class="stepper__button" data-direction="1" aria-label="Increase scale">+</button>
        </div>
      </div>
      <div class="field">
        <label class="controls__label" for="crossfade">Crossfade size</label>
        <div class="stepper">
          <button type="button" class="stepper__button" data-direction="-1"
            aria-label="Decrease crossfade size">&minus;</button>
          <input id="crossfade" type="text" inputmode="numeric" autocomplete="off" spellcheck="false"
            class="stepper__input mask-tiles__value" value="45" data-min="0" data-max="300" data-step="5">
          <button type="button" class="stepper__button" data-direction="1"
            aria-label="Increase crossfade size">+</button>
        </div>
      </div>
    </section>

    <section class="controls__section controls__section_columns">
      <button type="button" class="button button_primary genb">Regenerate</button>
      <button type="button" class="button downloadb">Download</button>
    </section>

    <div class="controls__credit">by <a href="https://vyrtsev.com">Misha Vyrtsev</a></div>
  </div>

  <dialog class="dialog image-picker" aria-label="Choose image">
    <div class="dialog__body">
      <div class="dialog__header">
        <div class="controls__label">Image</div>
        <form method="dialog">
          <button class="dialog__close" aria-label="Close">&times;</button>
        </form>
      </div>
      <div class="image-picker__grid"></div>
    </div>
  </dialog>

  <dialog class="dialog size-dialog" aria-label="Download">
    <div class="dialog__body">
      <div class="dialog__header">
        <div class="controls__label">Download</div>
        <form method="dialog">
          <button class="dialog__close" aria-label="Close">&times;</button>
        </form>
      </div>
      <form class="size-dialog__form" method="dialog">
        <div class="controls__section_columns">
          <div class="field">
            <label class="controls__label" for="download-width">Width</label>
            <input id="download-width" class="input size-dialog__width" type="number" min="1" max="20000" step="1">
          </div>
          <div class="field">
            <label class="controls__label" for="download-height">Height</label>
            <input id="download-height" class="input size-dialog__height" type="number" min="1" max="20000" step="1">
          </div>
        </div>
        <div class="size-dialog__actions">
          <button class="button button_primary" value="download">Download</button>
        </div>
      </form>
    </div>
  </dialog>
</body>

</html>
